services:
  radar:
    build: .
    ports:
      - "${RADAR_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Bind mount: usamos ./data tal cual, con los embeddings ya generados.
      # Sobrevive a reinicios y lo comparten los comandos locales y Docker.
      - ./data:/app/data
    restart: unless-stopped
